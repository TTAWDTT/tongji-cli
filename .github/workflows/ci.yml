name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: CLI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies and CLI
        run: |
          python -m pip install uv==0.13.1
          uv sync --locked --no-editable --python 3.12
      - name: Check installed CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: '"$GITHUB_WORKSPACE/.venv/bin/tongji" --help'
      - name: Run test suite with Chrome
        run: |
          google-chrome --version
          .venv/bin/python -m unittest discover -s tests -v
